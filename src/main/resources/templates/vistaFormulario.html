<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGCH - Nueva Operación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Registrar Operación Comercial</h4>
                    </div>
                    <div class="card-body">
                        
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>

                        <form action="/operaciones/registrar" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Productor (Cliente)</label>
                                <select class="form-select" name="idCliente" required>
                                    <option value="" disabled selected>Seleccione un productor registrado...</option>
                                    <option th:each="cliente : ${listaClientes}" 
                                            th:value="${cliente.id}" 
                                            th:text="${cliente.nombre + ' (' + cliente.ubicacionCampo + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Monto Total ($)</label>
                                <input type="number" step="0.01" class="form-control" name="montoTotal" placeholder="0.00" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label fw-bold">Tipo de Hacienda</label>
                                    <select class="form-select" name="tipoHacienda" required>
                                        <option value="" disabled selected>Elija categoría...</option>
                                        <option value="Novillos">Novillos</option>
                                        <option value="Vaquillonas">Vaquillonas</option>
                                        <option value="Terneros/as">Terneros/as</option>
                                        <option value="Vacas Invernada">Vacas de Invernada</option>
                                        <option value="Toros">Toros</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="form-label fw-bold">Cantidad (Cabezas)</label>
                                    <input type="number" class="form-control" name="cantidad" placeholder="0" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">Guardar Operación</button>
                                <a href="/" class="btn btn-outline-secondary">Volver al Menú Principal</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
