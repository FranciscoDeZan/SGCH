<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGCH - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container text-center">
        <h1 class="display-3 text-success fw-bold mb-4">SGCH</h1>
        <p class="lead text-muted mb-5">Sistema de Gestión Integral para Consignatarios de Haciendas</p>

        <div class="row justify-content-center gap-3">
            <div class="col-md-3">
                <div class="card shadow border-primary h-100">
                    <div class="card-body py-5">
                        <h4 class="card-title text-primary">👨‍🌾 Productores</h4>
                        <p class="card-text text-muted">Alta de nuevos clientes en el sistema.</p>
                        <a href="/clientes/formulario" class="btn btn-primary w-100">Registrar Cliente</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card shadow border-success h-100">
                    <div class="card-body py-5">
                        <h4 class="card-title text-success">🐄 Operaciones</h4>
                        <p class="card-text text-muted">Registrar compra/venta de hacienda.</p>
                        <a href="/operaciones/formulario" class="btn btn-success w-100">Nueva Operación</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow border-dark h-100">
                    <div class="card-body py-5">
                        <h4 class="card-title text-dark">📊 Reportes</h4>
                        <p class="card-text text-muted">Ver estadísticas y respaldos del día.</p>
                        <a href="/operaciones/resumen" class="btn btn-dark w-100">Ver Resumen Diario</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
