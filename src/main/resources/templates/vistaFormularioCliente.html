<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGCH - Nuevo Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Registrar Nuevo Cliente (Productor)</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>
                        <form action="/clientes/registrar" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre o Razón Social</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Teléfono de Contacto</label>
                                <input type="text" class="form-control" name="telefono" placeholder="+54 9..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ubicación del Campo</label>
                                <input type="text" class="form-control" name="ubicacionCampo">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Preferencias de Compra/Venta</label>
                                <textarea class="form-control" name="preferencias" rows="2"></textarea>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Guardar Cliente</button>
                                <a href="/operaciones/formulario" class="btn btn-outline-secondary">Ir a Registrar Operación</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
