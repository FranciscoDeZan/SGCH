<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGCH - Resumen Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Resumen de Operaciones (SGCH)</h2>
        
        <div class="alert alert-info" role="alert">
            ℹ️ Se ha generado automáticamente una copia de respaldo en el archivo <strong>resumen_operaciones.txt</strong>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Op.</th>
                            <th>Productor</th> 
                            <th>Fecha y Hora</th>
                            <th>Hacienda</th>
                            <th>Cabezas</th>
                            <th>Monto Total ($)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="op : ${listaOperaciones}">
                            <td th:text="${op.idOperacion}"></td>
                            <td class="fw-bold" th:text="${op.cliente.nombre}"></td>
                            <td th:text="${#temporals.format(op.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${op.tipoHacienda}"></td>
                            <td th:text="${op.cantidad}"></td>
                            <td class="fw-bold text-success" th:text="${op.montoTotal}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-outline-dark">Volver al Menú Principal</a>
        </div>
    </div>

</body>
</html>
