<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGCH - Éxito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm border-success">
                    <div class="card-body py-5">
                        <h1 class="display-4 text-success mb-3">✔️</h1>
                        <h2 class="text-success mb-4">¡Operación Exitosa!</h2>
                        
                        <p class="lead" th:text="${mensaje}"></p>
                        
                        <hr class="my-4">
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a href="/operaciones/formulario" class="btn btn-outline-success">Registrar Operación</a>
                            <a href="/clientes/formulario" class="btn btn-outline-primary">Registrar Cliente</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
